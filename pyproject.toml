[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-workshop-dl"
version = "0.4.1"
description = "Cross-platform Steam Workshop collection downloader"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mimore18" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Topic :: Utilities",
]

[project.scripts]
steam-workshop-dl = "steam_workshop_dl.ui.cli:main"
steam-workshop-dl-gui = "steam_workshop_dl.ui.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["steam_workshop_dl*"]

[tool.setuptools.package-data]
steam_workshop_dl = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
