<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c313b"/>
      <stop offset="0.55" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="badge" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6cb4ff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4c9aff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4c9aff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="arrowShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1b33" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#background)"/>
  <rect x="58" y="58" width="908" height="908" rx="200" fill="none" stroke="#6aa9ff" stroke-opacity="0.22" stroke-width="10"/>

  <!-- Soft glow behind the badge -->
  <circle cx="512" cy="500" r="350" fill="url(#glow)"/>

  <!-- Blue badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="512" cy="512" r="304" fill="url(#badge)"/>
    <circle cx="512" cy="512" r="304" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8"/>
  </g>

  <!-- Download arrow -->
  <g filter="url(#arrowShadow)" fill="#ffffff">
    <rect x="486" y="316" width="52" height="158" rx="26"/>
    <path d="M 416 454 L 608 454 L 512 610 Z"/>
  </g>

  <!-- Download base -->
  <rect x="356" y="674" width="312" height="48" rx="24" fill="#ffffff" filter="url(#arrowShadow)"/>
</svg>
